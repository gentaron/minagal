<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - ページが見つかりません | イラストギャラリー</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(1000px 500px at 50% -10%, rgba(108, 140, 255, .16), transparent 65%), #0b0b12;
    color: #e8e6f0;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    color-scheme: dark;
  }
  h1 { font-size: clamp(4rem, 14vw, 7rem); font-weight: 200; letter-spacing: .1em; color: #6c8cff; }
  p { color: #9a97ab; margin: 14px 0 30px; }
  a {
    display: inline-block;
    padding: 12px 28px;
    border: 1px solid rgba(108, 140, 255, .5);
    border-radius: 999px;
    color: #e8e6f0;
    text-decoration: none;
    letter-spacing: .1em;
    transition: background .2s, border-color .2s;
  }
  a:hover, a:focus-visible { background: rgba(108, 140, 255, .15); border-color: #6c8cff; }
</style>
</head>
<body>
<main>
  <h1>404</h1>
  <p>お探しのページは見つかりませんでした。</p>
  <a href="/">ギャラリーへ戻る</a>
</main>
