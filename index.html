<style>
  :root {
    --bg: #0b0b12;
    --bg-elev: #14141f;
    --text: #e8e6f0;
    --text-dim: #9a97ab;
    --accent: #6c8cff;
    --accent-warm: #ff5d5d;
    --radius: 12px;
    --shadow: 0 10px 30px rgba(0, 0, 0, .45);
    --ease: cubic-bezier(.22, 1, .36, 1);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent); color: #fff; }

  .skip-link {
    position: absolute;
    left: 8px;
    top: -48px;
    z-index: 2000;
    padding: 10px 16px;
    background: var(--accent);
    color: #fff;
    border-radius: 8px;
    text-decoration: none;
    transition: top .2s var(--ease);
  }
  .skip-link:focus { top: 8px; }

  /* ---------- Header ---------- */
  header {
    position: relative;
    padding: clamp(64px, 12vh, 120px) 24px clamp(40px, 7vh, 72px);
    text-align: center;
    overflow: hidden;
    background:
      radial-gradient(1200px 500px at 50% -10%, rgba(108, 140, 255, .18), transparent 65%),
      radial-gradient(800px 400px at 85% 10%, rgba(255, 93, 93, .08), transparent 60%),
      var(--bg);
  }
  header::after {
    content: "";
    position: absolute;
    inset: auto 0 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(232, 230, 240, .18), transparent);
  }
  .eyebrow {
    display: inline-block;
    font-size: .78rem;
    letter-spacing: .35em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 14px;
  }
  header h1 {
    font-size: clamp(1.7rem, 4.5vw, 2.8rem);
    font-weight: 600;
    letter-spacing: .14em;
    color: #fff;
  }
  header .lede {
    max-width: 42em;
    margin: 16px auto 0;
    color: var(--text-dim);
    font-size: clamp(.9rem, 1.6vw, 1rem);
  }
  .stats {
    margin-top: 22px;
    font-size: .82rem;
    letter-spacing: .12em;
    color: var(--text-dim);
  }
  .stats strong { color: var(--text); font-weight: 600; }

  /* ---------- Gallery ---------- */
  main { max-width: 1440px; margin: 0 auto; padding: clamp(28px, 5vh, 56px) 20px 90px; }
  .gallery { column-count: 3; column-gap: 18px; }
  @media (max-width: 1000px) { .gallery { column-count: 2; } }
  @media (max-width: 560px)  { .gallery { column-count: 1; column-gap: 0; } }

  .item {
    break-inside: avoid;
    margin-bottom: 18px;
    border-radius: var(--radius);

  }
  .item:hover { transform: translateY(-5px); box-shadow: var(--shadow); }
  .item a {
    display: block;
    position: relative;
    color: inherit;
    text-decoration: none;
    outline-offset: -3px;
  }
  .item a:focus-visible { outline: 3px solid var(--accent); border-radius: var(--radius); }
  .item img {

    height: auto;
    display: block;
    background: #191924;

  .item figcaption {
    position: absolute;
    inset: auto 0 0;
    padding: 48px 16px 12px;
    background: linear-gradient(transparent, rgba(5, 5, 12, .82));
    font-size: .85rem;
    letter-spacing: .06em;
    color: #fff;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity .35s var(--ease), transform .35s var(--ease);

  }
  .item figcaption .num {
    display: block;
    font-size: .68rem;
    letter-spacing: .3em;
    color: var(--accent);
    margin-bottom: 2px;
  }
  .item a:hover figcaption,
  .item a:focus-visible figcaption { opacity: 1; transform: none; }

  /* Scroll reveal (JS adds .reveal; no-JS stays fully visible) */
  .js .item { opacity: 0; transform: translateY(24px); }
  .js .item.reveal { opacity: 1; transform: none; transition: opacity .7s var(--ease), transform .7s var(--ease); }
  .js .item.reveal:hover { transform: translateY(-5px); }

  /* ---------- Lightbox (native <dialog>) ---------- */
  dialog.lightbox {
    width: 100vw;
    height: 100dvh;
    max-width: none;
    max-height: none;
    border: 0;
    padding: 0;
    background: transparent;
    color: var(--text);
    overflow: hidden;
  }
  dialog.lightbox::backdrop { background: rgba(4, 4, 10, .93); backdrop-filter: blur(6px); }
  .lb-stage {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: clamp(16px, 4vw, 48px);
    touch-action: pan-y;
  }
  .lb-stage img {
    max-width: 100%;
    max-height: calc(100dvh - 150px);
    object-fit: contain;
    border-radius: 8px;
    box-shadow: 0 8px 60px rgba(0, 0, 0, .7);

  .lb-meta .lb-counter { margin-top: 4px; font-size: .78rem; letter-spacing: .25em; color: var(--text-dim); }

    width: 48px;

    background: rgba(255, 255, 255, .06);
    color: #fff;
    font-size: 1.5rem;
    line-height: 1;
    cursor: pointer;
    transition: background .2s, border-color .2s;

  .lb-btn:hover, .lb-btn:focus-visible { background: rgba(255, 255, 255, .16); border-color: rgba(255, 255, 255, .3); }
  .lb-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .lb-close { top: 18px; right: 18px; }
  .lb-prev { left: 16px; top: 50%; transform: translateY(-50%); }
  .lb-next { right: 16px; top: 50%; transform: translateY(-50%); }
  @media (max-width: 560px) {
    .lb-prev, .lb-next { width: 42px; height: 42px; }
    .lb-prev { left: 8px; }
    .lb-next { right: 8px; }

  /* ---------- Footer ---------- */

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .js .item { opacity: 1; transform: none; }
  }
</style>
</head>

    <img id="lbImage" src="" alt="">

<script>
(() => {
  'use strict';
  document.documentElement.classList.add('js');

  const links = Array.from(document.querySelectorAll('.item a'));
  const works = links.map(a => ({
    full: a.getAttribute('href'),
    title: a.dataset.title,
    alt: a.querySelector('img').alt,
    w: a.dataset.w,
    h: a.dataset.h,
  }));

  /* ---- Scroll reveal ---- */
  const items = document.querySelectorAll('.item');
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) { e.target.classList.add('reveal'); io.unobserve(e.target); }
      });
    }, { rootMargin: '0px 0px -8% 0px' });
    items.forEach(el => io.observe(el));
  } else {
    items.forEach(el => el.classList.add('reveal'));
  }

  /* ---- Lightbox ---- */
  const lb = document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImage');
  const lbTitle = document.getElementById('lbTitle');
  const lbCounter = document.getElementById('lbCounter');
  const lbStage = document.getElementById('lbStage');
  let current = 0;
  let opener = null;

  function preload(i) {
    const idx = (i + works.length) % works.length;
    new Image().src = works[idx].full;
  }

  function show(i) {
    current = (i + works.length) % works.length;
    const work = works[current];
    lbImg.classList.add('loading');
    lbImg.onload = () => lbImg.classList.remove('loading');
    lbImg.src = work.full;
    lbImg.alt = work.alt;
    lbTitle.textContent = work.title;
    lbCounter.textContent = `${current + 1} / ${works.length}`;
    preload(current + 1);
    preload(current - 1);
  }

  function open(i, openerEl) {
    opener = openerEl;
    show(i);
    lb.showModal();
    document.body.style.overflow = 'hidden';
  }

  lb.addEventListener('close', () => {
    document.body.style.overflow = '';
    lbImg.src = '';
    if (opener) opener.focus();
  });

  links.forEach((a, i) => {
    a.addEventListener('click', (e) => {
      if (e.metaKey || e.ctrlKey || e.shiftKey) return; // respect open-in-new-tab
      e.preventDefault();
      open(i, a);
    });
  });

  document.getElementById('lbClose').addEventListener('click', () => lb.close());
  document.getElementById('lbPrev').addEventListener('click', () => show(current - 1));
  document.getElementById('lbNext').addEventListener('click', () => show(current + 1));

  lb.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') { e.preventDefault(); show(current - 1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); show(current + 1); }
  });

  // Close when clicking the backdrop / empty stage area
  lb.addEventListener('click', (e) => {
    if (e.target === lb || e.target === lbStage) lb.close();
  });

  // Touch swipe
  let touchX = null, touchY = null;
  lbStage.addEventListener('touchstart', (e) => {
    touchX = e.changedTouches[0].clientX;
    touchY = e.changedTouches[0].clientY;
  }, { passive: true });
  lbStage.addEventListener('touchend', (e) => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    const dy = e.changedTouches[0].clientY - touchY;
    if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      show(dx < 0 ? current + 1 : current - 1);
    }
    touchX = touchY = null;
  }, { passive: true });
})();
</script>
